<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Portolan</title>
    <style>
      html, body { margin: 0; height: 100%; background: #f1e4c8; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      #meter { position: fixed; bottom: env(safe-area-inset-bottom); left: env(safe-area-inset-left); margin: 4px 8px; z-index: 1;
             font: 14px ui-monospace, monospace; color: #fff; }
      #fps { position: fixed; top: calc(env(safe-area-inset-top) + 72px); left: calc(env(safe-area-inset-left) + 8px); z-index: 4;
             padding: 1px 5px; border-radius: 3px; background: rgba(0, 0, 0, 0.45); pointer-events: none;
             font: 11px ui-monospace, monospace; color: #fff; }
      #fps:empty { display: none; }
    </style>
  </head>
  <body>
    <div id="meter"></div>
    <div id="fps"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
