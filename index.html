<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Portolan</title>
    <style>
      html, body { margin: 0; height: 100%; background: #f1e4c8; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      /* the frame's cost, in the bottom-left corner (meter.ts): over every screen, never taking a touch */
      #meter { position: fixed; bottom: env(safe-area-inset-bottom); left: env(safe-area-inset-left); margin: 10px; z-index: 10;
               pointer-events: none; padding: 7px 10px 8px; border-radius: 8px; background: rgba(20, 14, 9, .62);
               font: 12px/1.45 ui-monospace, Menlo, monospace; color: #f3e6c8; min-width: 190px; }
      #meter:empty { display: none; }
      #meter div { display: flex; gap: 8px; }
      #meter span { width: 66px; color: #b9a98c; }
      #meter b { font-weight: 600; min-width: 52px; text-align: right; }
      #meter i { font-style: normal; color: #b9a98c; }
      #meter .fps { font-size: 13px; margin-bottom: 3px; gap: 4px; align-items: baseline; }
      #meter .fps b { font-size: 20px; min-width: 0; text-align: left; }
      #meter .good b { color: #8fd18a; } #meter .fair b { color: #e8c35a; } #meter .poor b { color: #f07a5e; }
    </style>
  </head>
  <body>
    <div id="meter" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
