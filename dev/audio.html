<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portolan sound board</title>
  <style>
    :root { --bg: #14181d; --panel: #1d232a; --line: #2c343d; --ink: #e8e2d4; --dim: #8d97a3; --accent: #e0b25c; --on: #5cc2a7; --hot: #e2725b; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.35 system-ui, -apple-system, sans-serif; }
    header { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; padding: 10px 16px; background: #10141aee; border-bottom: 1px solid var(--line); backdrop-filter: blur(6px); }
    h1 { font-size: 16px; margin: 0; letter-spacing: 0.02em; }
    h2 { font-size: 13px; margin: 0 0 8px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.08em; }
    main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; padding: 16px; }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
    section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 16px; }
    .grid { display: flex; flex-wrap: wrap; gap: 6px; }
    button { font: inherit; color: var(--ink); background: #27303a; border: 1px solid #36414d; border-radius: 6px; padding: 6px 9px; cursor: pointer; }
    button:hover { background: #313c48; }
    button.loop { border-style: dashed; }
    button.on { background: #1f4a40; border-color: var(--on); }
    button.flash { background: #5a4520; border-color: var(--accent); }
    button small { color: var(--dim); margin-left: 4px; }
    label { display: flex; align-items: center; gap: 8px; }
    .sliders label { display: grid; grid-template-columns: 130px 1fr 38px; gap: 8px; margin: 3px 0; }
    .sliders output { color: var(--dim); text-align: right; font-variant-numeric: tabular-nums; }
    input[type=range] { width: 100%; accent-color: var(--accent); }
    #pad { width: 100%; aspect-ratio: 1; background: radial-gradient(circle, #23303a 0 2%, #1a2027 2% 100%); border: 1px solid var(--line); border-radius: 50%; position: relative; cursor: crosshair; }
    #pad .ring { position: absolute; border: 1px dashed #33404c; border-radius: 50%; pointer-events: none; }
    #pad .ring span { position: absolute; top: -8px; left: 50%; transform: translateX(-50%); font-size: 10px; color: var(--dim); background: #1a2027; padding: 0 3px; }
    #dot { position: absolute; width: 14px; height: 14px; margin: -7px; border-radius: 50%; background: var(--hot); box-shadow: 0 0 8px var(--hot); pointer-events: none; }
    #me { position: absolute; left: 50%; top: 50%; width: 0; height: 0; margin-left: -7px; margin-top: -10px; border: 7px solid transparent; border-bottom: 14px solid var(--on); border-top: 0; pointer-events: none; }
    #meter { height: 10px; background: #0d1014; border-radius: 5px; overflow: hidden; width: 160px; }
    #meter div { height: 100%; width: 0; background: linear-gradient(90deg, var(--on), var(--accent) 70%, var(--hot)); }
    #log { height: 160px; overflow: auto; font: 11px/1.4 ui-monospace, monospace; color: var(--dim); white-space: pre; }
    .dim { color: var(--dim); }
    h2.sub { margin-top: 12px; }
    #lock { color: var(--hot); }
  </style>
</head>
<body>
  <header>
    <h1>Portolan sound board</h1>
    <span id="lock">Tap anywhere to start the sound</span>
    <div id="meter" title="output level"><div></div></div>
    <span id="stats" class="dim"></span>
    <label>Rarity <select id="rarity"><option value="0">Common</option><option value="1">Uncommon</option><option value="2" selected>Rare</option><option value="3">Epic</option><option value="4">Legendary</option></select></label>
    <label>Level <input id="level" type="range" min="0" max="1" step="0.01" value="0.5" style="width:90px" /></label>
    <label><input id="own" type="checkbox" checked /> Your own (no position)</label>
  </header>
  <main>
    <div id="sounds"></div>
    <aside>
      <section>
        <h2>Where sounds play</h2>
        <div id="pad"><div id="me"></div><div id="dot"></div></div>
        <p class="dim" id="where">Untick "your own", then click the circle to place sounds around the listener (facing up). Rings at 50, 150, 300 and 600 m.</p>
      </section>
      <section class="sliders">
        <h2>Volumes</h2>
        <div id="volumes"></div>
      </section>
      <section class="sliders">
        <h2>Ambience</h2>
        <div class="grid" style="margin-bottom:8px">
          <button id="ambOn">Start ambience</button>
          <button id="tour">Tour the regions</button>
          <button id="clear">Clear regions</button>
        </div>
        <div id="mixer"></div>
      </section>
      <section>
        <h2>Log</h2>
        <div id="log"></div>
      </section>
    </aside>
  </main>
  <script type="module" src="./audio.ts"></script>
</body>
</html>
