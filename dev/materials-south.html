<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Materials South</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1520; font: 13px/1.3 -apple-system, system-ui, sans-serif; }
      canvas { display: block; }
      #bar { position: fixed; top: 8px; left: 8px; right: 8px; display: flex; flex-wrap: wrap; gap: 6px; z-index: 2; }
      #bar a, #bar button { padding: 4px 9px; border-radius: 6px; background: rgba(10, 16, 24, 0.7); color: #e8eef5; text-decoration: none; border: 1px solid rgba(255, 255, 255, 0.18); font: inherit; cursor: pointer; }
      #bar a.on { background: rgba(232, 238, 245, 0.85); color: #0d1520; }
      #status { position: fixed; bottom: 10px; left: 10px; color: #e8eef5; text-shadow: 0 1px 2px #000; }
      #legend { position: fixed; right: 8px; bottom: 8px; display: flex; flex-direction: column; gap: 4px; z-index: 2; }
      #legend .row { display: flex; gap: 8px; align-items: center; padding: 4px 8px 4px 4px; border-radius: 6px; background: rgba(10, 16, 24, 0.72); color: #e8eef5; }
      #legend canvas { width: 44px; height: 44px; border-radius: 4px; }
      #legend span { opacity: 0.6; }
      .label { position: fixed; left: 0; top: 0; padding: 2px 7px; border-radius: 5px; background: rgba(10, 16, 24, 0.65); color: #fff; pointer-events: none; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="bar"></div>
    <div id="legend"></div>
    <div id="status">loading</div>
    <script type="module" src="/src/render/materials/southPreview.ts"></script>
  </body>
</html>
