<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portolan icons</title>
<style>
  :root {
    --ink: #2a1a0d; --cream: #f6e9c8; --paper: #e9d7b0; --paper-d: #d9c08f; --night: #2a1d12; --night-d: #1a120a;
    --sea: #1b4a5e; --sea-d: #0b2532; --sky: #a9cfdc;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Georgia, serif; color: var(--ink); background: #cdb88e; }
  header { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 10px 16px;
    background: var(--night); color: var(--cream); box-shadow: 0 2px 10px rgba(0,0,0,.4); }
  header h1 { margin: 0 12px 0 0; font: 700 18px Georgia, serif; letter-spacing: .08em; }
  header label { font-size: 14px; display: flex; gap: 6px; align-items: center; }
  header select, header input { font: inherit; }
  main { padding: 12px 16px 48px; }
  h2 { font: 700 15px Georgia, serif; letter-spacing: .1em; text-transform: uppercase; margin: 26px 0 10px; }
  h2 small { font: italic 14px Georgia, serif; text-transform: none; letter-spacing: 0; opacity: .75; margin-left: 8px; }
  .light { background: radial-gradient(ellipse at 30% 20%, #f3e5c2, transparent 70%), radial-gradient(ellipse at 80% 90%, #d2b580, transparent 60%), var(--paper); color: var(--ink); }
  .dark { background: radial-gradient(ellipse at 30% 20%, #3b2a1a, transparent 70%), radial-gradient(ellipse at 80% 90%, #120c06, transparent 60%), var(--night); color: var(--cream); }
  .sea { background: linear-gradient(180deg, var(--sky) 0 38%, #5f9bb0 38%, var(--sea) 60%, var(--sea-d)); color: var(--cream); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 10px; }
  .card { border-radius: 10px; overflow: hidden; box-shadow: 0 1px 0 rgba(255,255,255,.4) inset, 0 2px 6px rgba(40,20,0,.35); background: var(--paper-d); }
  .card .name { display: flex; justify-content: space-between; gap: 8px; padding: 6px 10px; font-size: 15px; background: rgba(42,26,13,.08); }
  .card .name code { font: 11px ui-monospace, Menlo, monospace; opacity: .65; align-self: center; }
  .row { display: flex; align-items: center; gap: 14px; padding: 8px 10px; min-height: 40px; }
  .row .tag { width: 34px; font: italic 11px Georgia, serif; opacity: .7; }
  .row svg { flex: none; display: block; }
  .strip { display: flex; flex-wrap: wrap; gap: 10px; padding: 10px; border-radius: 10px; }
  .strip > span { display: grid; place-items: center; width: 34px; height: 34px; }
  .rarities { display: flex; flex-wrap: wrap; gap: 14px; padding: 12px; border-radius: 10px; align-items: end; }
  .rarities figure { margin: 0; text-align: center; font-size: 13px; }
  .rarities figcaption { margin-top: 4px; }
  .single { display: flex; flex-wrap: wrap; gap: 24px; padding: 24px; border-radius: 12px; align-items: center; }
  @media (max-width: 420px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Portolan icons</h1>
  <label>Paper <select id="bg"><option value="both">light and dark</option><option value="light">light</option><option value="dark">dark</option></select></label>
  <label>Family <select id="family"><option value="">all</option></select></label>
  <label><input type="checkbox" id="frames" checked> frames</label>
  <label><input type="checkbox" id="outlines" checked> outlines</label>
  <label><input type="checkbox" id="tints"> tints</label>
  <span id="count" style="margin-left:auto;font-size:13px;opacity:.75"></span>
</header>
<main id="sheet"></main>
<script type="module">
  // The icon sheet: every icon at 24, 48 and 96 px on light and dark parchment, its frame, and the outlined form used
  // over the sea. URL parameters: bg=light|dark|both, family=<name>, frames=0, outlines=0, tints=1, only=<icon name>,
  // sizes=24,48,96.
  import { icon, iconsIn, ICON_NAMES, RANK_ORDER, RARITY_NAMES } from '/src/icons/index.ts';
  import { ABILITIES } from '/src/sim/abilities.ts';
  import { REGIONS } from '/src/sim/world/index.ts';

  const q = new URLSearchParams(location.search);
  const FAMILIES = [
    ['weapon', 'Weapons', 'six classes; framed by rarity'],
    ['item', 'Consumables', 'framed at their own rarity'],
    ['ability', 'Abilities', 'actives on lapis medallions, passives on bronze hexagons'],
    ['perk', 'Region perks', 'on wax seals'],
    ['region', 'Regions', 'on chart roundels in each region\'s colour'],
    ['rank', 'Ranks', 'full colour, Iron I to Legend; the bottom row is mono'],
    ['hud', 'HUD', 'outlined over the sea'],
    ['menu', 'Menus', 'outlined over the sea'],
    ['gull', 'Gull deliveries', 'cheapest first'],
  ];
  const sizes = (q.get('sizes') ?? '24,48,96').split(',').map(Number).filter(Boolean);

  const words = (s) => s.replace(/([a-z])([A-Z0-9])/g, '$1 $2').replace(/^./, (c) => c.toUpperCase());
  const ROMAN = { 1: 'I', 2: 'II', 3: 'III' };
  function label(name) {
    const [fam, id] = name.split('.');
    if (fam === 'ability') return ABILITIES.find((a) => a.id === id).name;
    if (fam === 'perk') return REGIONS.find((r) => r.perk === id).perkName;
    if (fam === 'region') return REGIONS.find((r) => r.id === id).name.replace(/^the /, 'The ');
    if (fam === 'rank') return /\d$/.test(id) ? `${words(id.slice(0, -1))} ${ROMAN[id.slice(-1)]}` : words(id);
    if (fam === 'item') return words(id);
    if (fam === 'gull') return words(id);
    return words(id);
  }

  const $ = (id) => document.getElementById(id);
  for (const [f, title] of FAMILIES) $('family').add(new Option(title, f));
  $('bg').value = q.get('bg') ?? 'both';
  $('family').value = q.get('family') ?? '';
  $('frames').checked = q.get('frames') !== '0';
  $('outlines').checked = q.get('outlines') !== '0';
  $('tints').checked = q.get('tints') === '1';
  for (const id of ['bg', 'family', 'frames', 'outlines', 'tints']) $(id).addEventListener('change', () => {
    const p = new URLSearchParams(location.search);
    p.set('bg', $('bg').value);
    $('family').value ? p.set('family', $('family').value) : p.delete('family');
    $('frames').checked ? p.delete('frames') : p.set('frames', '0');
    $('outlines').checked ? p.delete('outlines') : p.set('outlines', '0');
    $('tints').checked ? p.set('tints', '1') : p.delete('tints');
    history.replaceState(null, '', '?' + p);
    render();
  });

  function el(tag, cls, html = '') {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    e.innerHTML = html;
    return e;
  }

  function row(cls, tag, items) {
    const r = el('div', 'row ' + cls, `<span class="tag">${tag}</span>`);
    for (const s of items) r.insertAdjacentHTML('beforeend', s);
    return r;
  }

  function card(name, opts) {
    const fam = name.split('.')[0], tint = opts.tints;
    const c = el('div', 'card', `<div class="name"><span>${label(name)}</span><code>${name}</code></div>`);
    if (opts.bg !== 'dark') c.append(row('light', 'light', sizes.map((s) => icon(name, { size: s, tint, title: label(name) }))));
    if (opts.bg !== 'light') c.append(row('dark', 'dark', sizes.map((s) => icon(name, { size: s, tint }))));
    if (fam === 'rank') c.append(row('light', 'mono', sizes.map((s) => icon(name, { size: s, mono: true }))));
    else if (opts.frames) c.append(row(opts.bg === 'dark' ? 'dark' : 'light', 'frame', sizes.map((s) => icon(name, { size: Math.max(s, 32), frame: true }))));
    if (opts.outlines && (fam === 'hud' || fam === 'menu' || fam === 'weapon')) {
      c.append(row('sea', 'sea', sizes.map((s) => icon(name, { size: s, outline: true, tint: true }))));
    }
    return c;
  }

  function render() {
    const opts = { bg: $('bg').value, frames: $('frames').checked, outlines: $('outlines').checked, tints: $('tints').checked };
    const only = q.get('only'), fam = $('family').value;
    const main = $('sheet');
    main.replaceChildren();
    if (only) {
      const box = el('div', 'single light');
      for (const s of [24, 48, 96, 160]) box.insertAdjacentHTML('beforeend', icon(only, { size: s }));
      for (const s of [96, 160]) box.insertAdjacentHTML('beforeend', icon(only, { size: s, frame: true }));
      main.append(el('h2', '', `${label(only)} <small>${only}</small>`), box);
      const dark = el('div', 'single dark');
      for (const s of [24, 48, 96, 160]) dark.insertAdjacentHTML('beforeend', icon(only, { size: s }));
      main.append(dark);
      return;
    }
    let n = 0;
    if (!fam) {
      // the phone check: every icon at 24 px, as it will be seen in a match
      main.append(el('h2', '', 'Every icon at 24 px <small>the phone check</small>'));
      for (const bg of opts.bg === 'both' ? ['light', 'dark'] : [opts.bg]) {
        const s = el('div', 'strip ' + bg);
        for (const name of ICON_NAMES) s.append(el('span', '', icon(name, { size: 24, tint: opts.tints, title: name })));
        main.append(s, el('div', '', '&nbsp;'));
      }
      // rarity tiles side by side
      main.append(el('h2', '', 'Rarity tiles <small>common to legendary; gems in the bottom edge count the rarity</small>'));
      const r = el('div', 'rarities dark');
      for (const [i, rn] of RARITY_NAMES.entries()) {
        r.append(el('figure', '', icon('weapon.cannon', { size: 96, rarity: i }) + `<figcaption>${rn}</figcaption>`));
      }
      for (const [i, rn] of RARITY_NAMES.entries()) {
        r.append(el('figure', '', icon('weapon.harpoon', { size: 48, rarity: i }) + icon('weapon.harpoon', { size: 24, rarity: i }) + `<figcaption>${rn}</figcaption>`));
      }
      main.append(r);
      // the rank ladder in order
      main.append(el('h2', '', 'Rank ladder <small>Iron I to Legend</small>'));
      const ladder = el('div', 'rarities light');
      for (const id of RANK_ORDER) ladder.append(el('figure', '', icon(`rank.${id}`, { size: 64 }) + `<figcaption>${label('rank.' + id)}</figcaption>`));
      main.append(ladder);
    }
    for (const [f, title, note] of FAMILIES) {
      if (fam && fam !== f) continue;
      main.append(el('h2', '', `${title} <small>${note}</small>`));
      const g = el('div', 'grid');
      for (const name of iconsIn(f)) { g.append(card(name, opts)); n++; }
      main.append(g);
    }
    $('count').textContent = `${n} icons`;
  }
  render();
</script>
</body>
</html>
