<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Portolan · weather</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; touch-action: none; }
    #panel { position: fixed; top: 12px; left: 12px; width: 300px; padding: 10px 12px; border-radius: 10px;
      background: rgba(12, 16, 22, 0.72); color: #dfe6ee; font: 12px/1.4 system-ui, sans-serif; backdrop-filter: blur(6px); }
    #panel h1 { margin: 0 0 6px; font-size: 14px; letter-spacing: 0.04em; }
    #panel .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 5px 0; }
    #panel label { display: inline-flex; gap: 3px; align-items: center; }
    #panel input[type=range] { flex: 1; }
    #panel button { background: #2a3442; color: #e8eef5; border: 0; border-radius: 6px; padding: 4px 8px; font: inherit; cursor: pointer; }
    #panel button:hover { background: #3a4758; }
    #panel pre { margin: 6px 0 0; font: 11px/1.35 ui-monospace, monospace; color: #9fb0c2; white-space: pre-wrap; }
    #panel .help { margin: 4px 0 0; color: #7d8d9e; }
  </style>
</head>
<body>
  <script type="module" src="../src/render/weather/dev/main.ts"></script>
</body>
</html>
