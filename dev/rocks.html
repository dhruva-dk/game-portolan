<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Portolan rocks</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b1016; overflow: hidden; font: 13px/1.35 system-ui, sans-serif; color: #e8eef2; }
      canvas { display: block; }
      #panel { position: fixed; top: 8px; left: 8px; background: rgba(8, 12, 18, 0.72); padding: 8px 10px; border-radius: 8px; max-width: 360px; }
      #panel button, #panel select { font: inherit; margin: 2px 2px 2px 0; background: #1d2a36; color: #e8eef2; border: 1px solid #3a4f63; border-radius: 5px; padding: 3px 7px; }
      #panel button.on { background: #3b6d8f; }
      #panel .row { margin: 3px 0; }
      #stats { opacity: 0.75; font-size: 12px; }
      .label { position: fixed; transform: translate(-50%, -100%); pointer-events: none; font-size: 11px; white-space: nowrap; color: #fff; text-shadow: 0 1px 2px #000, 0 0 4px #000; }
      .label b { display: block; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="panel">
      <div class="row"><b>Rocks</b> <span id="stats"></span></div>
      <div class="row" id="views"></div>
      <div class="row" id="lights"></div>
      <div class="row" id="lods"></div>
      <div class="row" id="dists"></div>
      <div class="row"><select id="form"></select> <button id="seedDown">seed -</button><button id="seedUp">seed +</button></div>
      <div class="row">sea level <input id="sea" type="range" min="-2" max="2" step="0.1" value="0" /></div>
    </div>
    <script type="module" src="../src/render/rocks/dev.ts"></script>
  </body>
</html>
