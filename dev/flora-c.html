<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Flora C</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9cc4dc; font: 13px/1.3 system-ui, sans-serif; }
  canvas { display: block; width: 100%; height: 100%; }
  #ui { position: fixed; top: 8px; left: 8px; right: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; pointer-events: none; }
  #ui > * { pointer-events: auto; }
  #ui select, #ui button, #ui input { font: inherit; padding: 4px 6px; border-radius: 6px; border: 1px solid #0003; background: #fffd; }
  #ui button.on { background: #1d4f6e; color: #fff; }
  #info { position: fixed; bottom: 8px; left: 8px; color: #fff; text-shadow: 0 1px 2px #000a; white-space: pre; }
  #labels div { position: fixed; transform: translate(-50%, 0); color: #fff; font-size: 11px; text-shadow: 0 1px 2px #000; white-space: nowrap; pointer-events: none; text-align: center; }
  #labels b { font-size: 12px; }
  body.shot #ui, body.shot #info { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"></div>
<div id="labels"></div>
<div id="info"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
import { LOD_DISTANCES, instancePlant, plantLOD, rng, setTextureRoot, setWind, texturesReady, tickWind, triangles } from '../src/render/flora/kitC.ts';
import { PLANTS as glassSea } from '../src/render/flora/glassSea.ts';
import { PLANTS as jadeShoals } from '../src/render/flora/jadeShoals.ts';
import { PLANTS as coralAtolls } from '../src/render/flora/coralAtolls.ts';

// URL parameters:
//   region=all|glassSea|jadeShoals|coralAtolls|spiceIsles   plant=<id>   view=grid|turntable|field
//   lod=auto|0|1|2   light=day|dusk   wind=0..1   seed=<first seed>   seeds=<variants per plant>
//   dist=<camera metres from the subject>   fov=<degrees>   yaw=<deg>   pitch=<deg>   t=<frozen wind clock, s>
//   shot=1 hides the controls   labels=0 hides the labels
const REGIONS = { glassSea, jadeShoals, coralAtolls };
const NAMES = { glassSea: 'The Glass Sea', jadeShoals: 'The Jade Shoals', coralAtolls: 'The Coral Atolls', spiceIsles: 'The Spice Isles' };
const q = new URLSearchParams(location.search);
const P = {
  region: q.get('region') ?? 'all', plant: q.get('plant') ?? '', view: q.get('view') ?? 'grid', lod: q.get('lod') ?? 'auto',
  light: q.get('light') ?? 'day', wind: +(q.get('wind') ?? 0.4), seed: +(q.get('seed') ?? 1), seeds: +(q.get('seeds') ?? 3),
  dist: q.get('dist') ? +q.get('dist') : 0, fov: +(q.get('fov') ?? 45), yaw: +(q.get('yaw') ?? 35), pitch: +(q.get('pitch') ?? 14),
  t: q.get('t'), shot: q.get('shot') === '1', labels: q.get('labels') !== '0',
};
if (P.shot) document.body.classList.add('shot');
setTextureRoot('/');

// ------------------------------------------------------------ the plants on show
const list = [];
for (const [rid, plants] of Object.entries(REGIONS)) {
  if (P.region !== 'all' && P.region !== rid) continue;
  for (const p of plants) if (!P.plant || P.plant === p.id) list.push({ rid, p });
}

// ------------------------------------------------------------ renderer, sky, light, water
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(P.fov, 1, 0.1, 4000);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;

const dusk = P.light === 'dusk';
const LIGHT = dusk
  ? { sun: 0xffa060, sunI: 2.6, elev: 7, az: 200, sky: 0x6f7fb8, ground: 0x8a6048, hemi: 0.75, zenith: 0x2d3f78, horizon: 0xf2a070, exposure: 1.0 }
  : { sun: 0xfff4e0, sunI: 3.2, elev: 52, az: 140, sky: 0x9cc8ff, ground: 0xd8c8a0, hemi: 1.1, zenith: 0x3f78c8, horizon: 0xcfe6f4, exposure: 0.9 };
renderer.toneMappingExposure = LIGHT.exposure;
scene.fog = new THREE.Fog(LIGHT.horizon, 400, 2600);
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { z: { value: new THREE.Color(LIGHT.zenith) }, h: { value: new THREE.Color(LIGHT.horizon) } },
  vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: 'uniform vec3 z, h; varying vec3 vP; void main(){ float t = clamp(normalize(vP).y * 2.5, 0.0, 1.0); gl_FragColor = vec4(mix(h, z, t), 1.0); }',
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(3000, 32, 16), skyMat);
scene.add(sky);
scene.add(new THREE.HemisphereLight(LIGHT.sky, LIGHT.ground, LIGHT.hemi));
const sun = new THREE.DirectionalLight(LIGHT.sun, LIGHT.sunI);
const el = THREE.MathUtils.degToRad(LIGHT.elev), az = THREE.MathUtils.degToRad(LIGHT.az);
const sunDir = new THREE.Vector3(Math.cos(el) * Math.cos(az), Math.sin(el), Math.cos(el) * Math.sin(az));
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

const texLoader = new THREE.TextureLoader();
const sandTex = texLoader.load('/tex/sand_d.jpg');
sandTex.colorSpace = THREE.SRGBColorSpace;
sandTex.wrapS = sandTex.wrapT = THREE.RepeatWrapping;
sandTex.repeat.set(0.25, 0.25);
const sandMat = new THREE.MeshStandardMaterial({ map: sandTex, color: new THREE.Color(1.6, 1.55, 1.4), roughness: 0.95 });
const seabedMat = new THREE.MeshStandardMaterial({ map: sandTex, color: 0xd8f0ea, roughness: 0.95 });
const SEABED = -3.2;
// dev-page water: sand below the surface fades into the lagoon colour with depth
const WATER = new THREE.Color(dusk ? 0x1f6470 : 0x2fb8bc);
for (const m of [sandMat, seabedMat]) m.onBeforeCompile = (s) => {
  s.uniforms.uWater = { value: WATER };
  s.vertexShader = s.vertexShader.replace('#include <common>', '#include <common>\nvarying float vWY;').replace('#include <worldpos_vertex>', 'vWY = (modelMatrix * vec4(transformed, 1.0)).y;\n#include <worldpos_vertex>');
  s.fragmentShader = s.fragmentShader.replace('#include <common>', '#include <common>\nvarying float vWY;\nuniform vec3 uWater;').replace('#include <dithering_fragment>', 'gl_FragColor.rgb = mix(gl_FragColor.rgb, uWater * 0.55, clamp(-vWY / 5.0, 0.0, 0.75));\n#include <dithering_fragment>');
};
const seabed = new THREE.Mesh(new THREE.PlaneGeometry(6000, 6000).rotateX(-Math.PI / 2), seabedMat);
seabed.position.y = SEABED;
seabed.receiveShadow = true;
scene.add(seabed);
const water = new THREE.Mesh(new THREE.PlaneGeometry(6000, 6000).rotateX(-Math.PI / 2),
  new THREE.MeshStandardMaterial({ color: dusk ? 0x2a7f8c : 0x3fd0d0, transparent: true, opacity: 0.2, roughness: 0.08, metalness: 0.1, depthWrite: false }));
water.renderOrder = 2;
scene.add(water);

function island(x, z, r) {
  // a low sand isle sloping gently into the lagoon
  const prof = [[r * 1.5, SEABED - 0.1], [r * 1.15, -0.6], [r * 0.95, 0.05], [r * 0.7, 0.25], [0, 0.27]].map(([a, b]) => new THREE.Vector2(a, b));
  const geo = new THREE.LatheGeometry(prof, 48);
  const pos = geo.getAttribute('position'), uv = geo.getAttribute('uv');
  for (let i = 0; i < pos.count; i++) uv.setXY(i, pos.getX(i), pos.getZ(i));
  const m = new THREE.Mesh(geo, sandMat);
  m.position.set(x, 0, z);
  m.receiveShadow = true;
  scene.add(m);
}

// ------------------------------------------------------------ building the view
const labels = [];
function label(obj, html, y) {
  if (!P.labels) return;
  const d = document.createElement('div');
  d.innerHTML = html;
  document.getElementById('labels').appendChild(d);
  labels.push({ d, obj, y });
}
const under = (p) => p.placement.maxHeight < 0;
const plantDepth = (p) => Math.max(SEABED, Math.min(-1.2, (p.placement.minHeight + p.placement.maxHeight) / 2));
function make(p, seed) {
  if (P.lod === 'auto') return plantLOD(p, seed);
  return p.build(seed, +P.lod);
}
const tri = (o) => {
  if (o.isLOD) return o.levels.map((l) => (triangles(l.object) / 1000).toFixed(1) + 'k').join(' / ');
  return (triangles(o) / 1000).toFixed(1) + 'k';
};

let focus = new THREE.Vector3(), extent = 10;
const spinners = [];
if (P.view === 'grid') {
  // rows of plants, columns of seeds
  let z = 0;
  const sizes = list.map(({ p }) => {
    const b = new THREE.Box3().setFromObject(p.build(P.seed, 2));
    const s = b.getSize(new THREE.Vector3());
    return { w: Math.max(3, s.x, s.z) + 2.5, h: s.y };
  });
  const width = Math.max(...sizes.map((s) => s.w)) * P.seeds;
  list.forEach(({ rid, p }, i) => {
    const cell = sizes[i].w;
    z += cell / 2;
    for (let k = 0; k < P.seeds; k++) {
      const x = (k - (P.seeds - 1) / 2) * cell;
      const o = make(p, P.seed + k);
      const y = under(p) ? plantDepth(p) : 0.25;
      if (!under(p)) island(x, z, cell * 0.46);
      else {
        const m = new THREE.Mesh(new THREE.CylinderGeometry(cell * 0.4, cell * 0.45, 0.5, 32), seabedMat);
        m.position.set(x, y - 0.25, z);
        m.receiveShadow = true;
        scene.add(m);
      }
      o.position.set(x, y, z);
      o.rotation.y = k * 1.3;
      scene.add(o);
      label(o, `<b>${p.name}</b><br>${NAMES[rid] ?? rid} · seed ${P.seed + k} · ${tri(o)} tris`, -0.8);
    }
    z += cell / 2;
  });
  focus.set(0, 2, z / 2);
  extent = Math.max(width, z);
} else if (P.view === 'turntable') {
  const { rid, p } = list[0];
  const o = make(p, P.seed);
  const y = under(p) ? plantDepth(p) : 0.25;
  if (!under(p)) island(0, 0, 9);
  o.position.y = y;
  scene.add(o);
  spinners.push(o);
  const b = new THREE.Box3().setFromObject(p.build(P.seed, 2));
  focus.set(0, y + b.getSize(new THREE.Vector3()).y * 0.45, 0);
  extent = Math.max(6, b.getSize(new THREE.Vector3()).length());
  label(o, `<b>${p.name}</b><br>${NAMES[rid] ?? rid} · seed ${P.seed} · ${tri(o)} tris`, -0.8);
} else {
  // a field: hundreds of instanced copies of each plant, three seeds each, LOD by distance from the camera's start
  const N = 240, R = 110;
  island(0, 0, R + 10);
  const r = rng(9);
  const cam = new THREE.Vector3(0, 6, R + 60);
  list.forEach(({ p }, pi) => {
    const buckets = new Map();
    for (let i = 0; i < N; i++) {
      const a = r() * Math.PI * 2, d = Math.sqrt(r()) * R;
      const pos = new THREE.Vector3(Math.cos(a) * d, under(p) ? plantDepth(p) : 0.25, Math.sin(a) * d);
      const dist = pos.distanceTo(cam);
      const lod = P.lod === 'auto' ? (dist > LOD_DISTANCES[2] ? 2 : dist > LOD_DISTANCES[1] ? 1 : 0) : +P.lod;
      const key = (i % 3) * 3 + lod;
      if (!buckets.has(key)) buckets.set(key, []);
      const s = 0.8 + r() * 0.4;
      buckets.get(key).push(new THREE.Matrix4().compose(pos, new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), r() * 6.28), new THREE.Vector3(s, s, s)));
    }
    for (const [key, mats] of buckets) scene.add(instancePlant(p.build(P.seed + Math.floor(key / 3) + pi * 10, key % 3), mats));
  });
  focus.set(0, 3, 0);
  extent = R * 1.6;
}

// sun shadows fitted to the scene
sun.shadow.camera.left = sun.shadow.camera.bottom = -extent * 0.75;
sun.shadow.camera.right = sun.shadow.camera.top = extent * 0.75;
sun.shadow.camera.far = extent * 4;
sun.position.copy(focus).addScaledVector(sunDir, extent * 2);
sun.target.position.copy(focus);
sun.shadow.camera.updateProjectionMatrix();

const dist = P.dist || extent * 1.15 + 6;
const yaw = THREE.MathUtils.degToRad(P.yaw), pitch = THREE.MathUtils.degToRad(P.pitch);
camera.position.set(focus.x + Math.sin(yaw) * Math.cos(pitch) * dist, focus.y + Math.sin(pitch) * dist, focus.z + Math.cos(yaw) * Math.cos(pitch) * dist);
controls.target.copy(focus);
controls.update();

// ------------------------------------------------------------ controls
const ui = document.getElementById('ui');
const go = (k, v) => { q.set(k, v); location.search = q.toString(); };
function select(k, opts, cur) {
  const s = document.createElement('select');
  for (const [v, t] of opts) s.add(new Option(t, v, false, v === cur));
  s.onchange = () => go(k, s.value);
  ui.appendChild(s);
}
select('region', [['all', 'All four regions'], ...Object.keys(NAMES).map((k) => [k, NAMES[k]])], P.region);
select('view', [['grid', 'Grid'], ['turntable', 'Turntable'], ['field', 'Instanced field']], P.view);
select('lod', [['auto', 'LOD by distance'], ['0', 'LOD 0 (10 m)'], ['1', 'LOD 1 (50 m)'], ['2', 'LOD 2 (300 m)']], P.lod);
for (const l of ['day', 'dusk']) {
  const b = document.createElement('button');
  b.textContent = l;
  b.className = P.light === l ? 'on' : '';
  b.onclick = () => go('light', l);
  ui.appendChild(b);
}
for (const d of [10, 50, 300]) {
  const b = document.createElement('button');
  b.textContent = d + ' m';
  b.onclick = () => {
    const dir = camera.position.clone().sub(controls.target).normalize();
    camera.position.copy(controls.target).addScaledVector(dir, d);
  };
  ui.appendChild(b);
}
const w = document.createElement('input');
w.type = 'range'; w.min = 0; w.max = 1; w.step = 0.05; w.value = P.wind; w.title = 'wind';
w.oninput = () => setWind(new THREE.Vector3(1, 0, 0.3), +w.value);
ui.appendChild(w);

// ------------------------------------------------------------ the loop
setWind(new THREE.Vector3(1, 0, 0.3), P.wind);
function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();
const info = document.getElementById('info');
let frames = 0, last = performance.now(), fps = 0;
const timer = new THREE.Timer();
const tmp = new THREE.Vector3();
renderer.setAnimationLoop(() => {
  timer.update();
  const t = P.t !== null ? +P.t : timer.getElapsed();
  tickWind(t);
  for (const s of spinners) s.rotation.y = t * 0.25;
  controls.update();
  scene.traverse((o) => o.isLOD && o.update(camera));
  renderer.render(scene, camera);
  for (const l of labels) {
    tmp.copy(l.obj.position).add(new THREE.Vector3(0, l.y, 0)).project(camera);
    const vis = tmp.z < 1 && Math.abs(tmp.x) < 1.1 && Math.abs(tmp.y) < 1.1;
    l.d.style.display = vis ? '' : 'none';
    l.d.style.left = ((tmp.x + 1) / 2) * innerWidth + 'px';
    l.d.style.top = ((1 - tmp.y) / 2) * innerHeight + 'px';
  }
  frames++;
  const now = performance.now();
  if (now - last > 500) { fps = (frames * 1000) / (now - last); frames = 0; last = now; }
  const ri = renderer.info.render;
  info.textContent = `${fps.toFixed(0)} fps · ${ri.calls} draws · ${(ri.triangles / 1000).toFixed(0)}k tris · camera ${camera.position.distanceTo(controls.target).toFixed(0)} m`;
});
texturesReady().then(() => setTimeout(() => (window.__ready = true), 300));
</script>
</body>
</html>
