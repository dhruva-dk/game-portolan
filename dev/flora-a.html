<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Flora A</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d1014; color: #ece7dc; font: 13px/1.35 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; }
  #ui { position: fixed; top: 8px; left: 8px; background: rgba(12, 14, 18, 0.74); padding: 8px 10px; border-radius: 8px; max-width: 60vw; }
  #ui .row { margin: 3px 0; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  #ui b { min-width: 52px; display: inline-block; color: #b9b2a2; font-weight: 600; }
  #ui a { color: #ece7dc; text-decoration: none; padding: 2px 7px; border-radius: 5px; background: rgba(255, 255, 255, 0.08); }
  #ui a.on { background: #c9a35b; color: #1a1408; }
  #stats { position: fixed; bottom: 8px; left: 8px; background: rgba(12, 14, 18, 0.74); padding: 6px 9px; border-radius: 8px; white-space: pre; font: 11px/1.4 ui-monospace, monospace; }
  .label { position: fixed; transform: translate(-50%, 0); pointer-events: none; font-size: 12px; color: #fff; text-shadow: 0 1px 3px #000, 0 0 2px #000; white-space: nowrap; text-align: center; }
  .label small { color: #d9d2c0; }
  #atlas { position: fixed; inset: 0; overflow: auto; padding: 60px 12px 12px; display: none; gap: 12px; flex-wrap: wrap; background: repeating-conic-gradient(#3a3f46 0% 25%, #2b2f35 0% 50%) 0 0 / 24px 24px; }
  #atlas figure { margin: 0; }
  #atlas canvas { width: 512px; height: 512px; }
  body.noui #ui, body.noui #stats { display: none; }
</style>
</head>
<body>
<div id="atlas"></div>
<div id="labels"></div>
<div id="ui"></div>
<div id="stats"></div>
<script type="module">
// Flora A's dev page: every plant of the Ice Crown, the Fjords, Mistwood and the Spires.
// URL parameters:
//   region=all|iceCrown|fjords|mistwood|spires   view=grid|forest|atlas   plant=<id> (grid of seeds x LODs)
//   lod=auto|0|1|2   light=day|dusk   wind=<0..2>   dist=<m>   h=<camera height, forest>   yaw=<deg>   pitch=<deg>
//   tx=<m> ty=<m> (grid camera target)   turntable=0|1   seed=<n>   ui=0
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { PLANTS as ICE } from '../src/render/flora/iceCrown.ts';
import { PLANTS as FJORDS } from '../src/render/flora/fjords.ts';
import { PLANTS as MISTWOOD, ATLAS as MISTWOOD_ATLAS } from '../src/render/flora/mistwood.ts';
import { PLANTS as SPIRES } from '../src/render/flora/spires.ts';
import * as ice from '../src/render/flora/iceCrown.ts';
import * as fjords from '../src/render/flora/fjords.ts';
import * as spires from '../src/render/flora/spires.ts';
import { setWind, plantLOD, plantField, rng } from '../src/render/flora/kitA.ts';

const REGIONS = {
  iceCrown: { name: 'The Ice Crown', plants: ICE, atlas: ice.ATLAS, ground: 0xdfe8f0, water: 0x5d7380, sky: [0xcfe0ee, 0x8fb1cf], fog: 0.0016 },
  fjords: { name: 'The Fjords', plants: FJORDS, atlas: fjords.ATLAS, ground: 0x6f7468, water: 0x5fa8a0, sky: [0xd5dfe2, 0x86a9c2], fog: 0.0012 },
  mistwood: { name: 'Mistwood', plants: MISTWOOD, atlas: MISTWOOD_ATLAS, ground: 0x3c4a2c, water: 0x16201a, sky: [0xc4cbc8, 0x8d9da0], fog: 0.0035 },
  spires: { name: 'The Spires', plants: SPIRES, atlas: spires.ATLAS, ground: 0xc9c3b2, water: 0x3f9b9a, sky: [0xdbe6ea, 0x7fa6c8], fog: 0.0010 },
};

const q = new URLSearchParams(location.search);
const P = {
  region: q.get('region') ?? 'all',
  view: q.get('view') ?? 'grid',
  plant: q.get('plant'),
  lod: q.get('lod') ?? 'auto',
  light: q.get('light') ?? 'day',
  wind: Number(q.get('wind') ?? 0.6),
  dist: q.has('dist') ? Number(q.get('dist')) : null,
  h: q.has('h') ? Number(q.get('h')) : null,
  yaw: Number(q.get('yaw') ?? (q.get('view') === 'forest' ? 35 : 0)),
  pitch: q.has('pitch') ? Number(q.get('pitch')) : null,
  turntable: (q.get('turntable') ?? (q.get('view') === 'forest' ? '0' : '1')) === '1',
  seed: Number(q.get('seed') ?? 1),
  ty: q.has('ty') ? Number(q.get('ty')) : null,
  tx: q.has('tx') ? Number(q.get('tx')) : null,
};
if (q.get('ui') === '0') document.body.classList.add('noui');
const regionKeys = P.region === 'all' ? Object.keys(REGIONS) : [P.region];
const allPlants = regionKeys.flatMap((k) => REGIONS[k].plants.map((p) => ({ ...p, region: k })));
const state = { ready: false, frames: 0, stats: {} };
window.__floraA = state;

// ---------------------------------------------------------------- the controls

function link(key, value, label = value) {
  const u = new URLSearchParams(location.search);
  if (value === null) u.delete(key); else u.set(key, value);
  if (key === 'region' || key === 'view') u.delete('plant');
  const on = (q.get(key) ?? { region: 'all', view: 'grid', lod: 'auto', light: 'day' }[key] ?? null) === value;
  return `<a class="${on ? 'on' : ''}" href="?${u}">${label}</a>`;
}
document.getElementById('ui').innerHTML = [
  `<div class="row"><b>Region</b>${link('region', 'all')}${Object.keys(REGIONS).map((k) => link('region', k, REGIONS[k].name)).join('')}</div>`,
  `<div class="row"><b>View</b>${link('view', 'grid')}${link('view', 'forest')}${link('view', 'atlas')}</div>`,
  `<div class="row"><b>Plant</b>${allPlants.map((p) => link('plant', p.id, p.name)).join('')}</div>`,
  `<div class="row"><b>LOD</b>${['auto', '0', '1', '2'].map((l) => link('lod', l)).join('')}</div>`,
  `<div class="row"><b>Light</b>${link('light', 'day')}${link('light', 'dusk')}</div>`,
  `<div class="row"><b>Wind</b>${['0', '0.6', '1.2', '2'].map((w) => link('wind', w)).join('')}</div>`,
  `<div class="row"><b>Distance</b>${['10', '50', '300'].map((d) => link('dist', d, d + ' m')).join('')}</div>`,
].join('');

// ---------------------------------------------------------------- the atlas view

if (P.view === 'atlas') {
  const box = document.getElementById('atlas');
  box.style.display = 'flex';
  for (const k of regionKeys) {
    const fig = document.createElement('figure');
    fig.appendChild(REGIONS[k].atlas.paint());
    const cap = document.createElement('figcaption');
    cap.textContent = REGIONS[k].name;
    fig.appendChild(cap);
    box.appendChild(fig);
  }
  state.ready = true;
  throw new Error('atlas view: nothing more to do'); // stop the module here
}

// ---------------------------------------------------------------- the scene

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 6000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

const dusk = P.light === 'dusk';
const single = regionKeys.length === 1 ? REGIONS[regionKeys[0]] : null;
const skyCols = dusk ? [0xf0a070, 0x3c4370] : single ? single.sky : [0xd0dce4, 0x8aa8c4];
{
  const g = new THREE.SphereGeometry(5000, 32, 16);
  const m = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { a: { value: new THREE.Color(skyCols[0]) }, b: { value: new THREE.Color(skyCols[1]) } },
    vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: 'uniform vec3 a, b; varying vec3 vP; void main(){ gl_FragColor = vec4(mix(a, b, pow(clamp(vP.y, 0.0, 1.0), 0.6)), 1.0); }',
  });
  const sky = new THREE.Mesh(g, m);
  sky.renderOrder = -1;
  scene.add(sky);
}
scene.fog = new THREE.FogExp2(new THREE.Color(skyCols[0]).lerp(new THREE.Color(0x888888), 0.2), single ? single.fog * (dusk ? 1.2 : 1) : 0.0012);

const sun = new THREE.DirectionalLight(dusk ? 0xff9858 : 0xfff2e0, dusk ? 2.4 : 3.2);
const elev = THREE.MathUtils.degToRad(dusk ? 7 : 46), azim = THREE.MathUtils.degToRad(dusk ? 115 : 58);
const sunDir = new THREE.Vector3(Math.cos(elev) * Math.cos(azim), Math.sin(elev), Math.cos(elev) * Math.sin(azim));
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.05;
scene.add(sun, sun.target);
scene.add(new THREE.HemisphereLight(dusk ? 0x7076a8 : 0xc4d6ec, dusk ? 0x302420 : 0x4a4636, dusk ? 0.7 : 1.3));
renderer.toneMappingExposure = dusk ? 1.15 : 1.0;

function fitShadow(center, radius) {
  sun.target.position.copy(center);
  sun.position.copy(center).addScaledVector(sunDir, radius * 3);
  const c = sun.shadow.camera;
  c.left = c.bottom = -radius;
  c.right = c.top = radius;
  c.near = 1;
  c.far = radius * 6;
  c.updateProjectionMatrix();
}

const labels = [];
function label(text, sub, pos) {
  const el = document.createElement('div');
  el.className = 'label';
  el.innerHTML = `${text}${sub ? `<br><small>${sub}</small>` : ''}`;
  document.getElementById('labels').appendChild(el);
  labels.push({ el, pos });
}

const lodLevel = P.lod === 'auto' ? null : Number(P.lod);
const build = (p, seed) => (lodLevel === null ? plantLOD(p, seed) : p.build(seed, lodLevel));
const tris = (p) => [0, 1, 2].map((l) => p.build(P.seed, l).userData.triangles);
const bounds = (o) => new THREE.Box3().setFromObject(o);

// ---------------------------------------------------------------- the grid view

function groundPlane(size, color) {
  const g = new THREE.CircleGeometry(size, 64);
  g.rotateX(-Math.PI / 2);
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color, roughness: 0.95 }));
  m.receiveShadow = true;
  scene.add(m);
  return m;
}

function grid() {
  const list = P.plant ? allPlants.filter((p) => p.id === P.plant) : allPlants;
  let z = 0, maxW = 0;
  const center = new THREE.Vector3();
  const objs = [];
  if (P.plant) {
    // one plant: three seeds across, three LODs deep
    const p = list[0];
    const probe = bounds(p.build(P.seed, 0)).getSize(new THREE.Vector3());
    const step = Math.max(probe.x, probe.z, probe.y * 0.45) * 1.25 + 0.5;
    for (let l = 0; l < 3; l++)
      for (let s = 0; s < 3; s++) {
        const o = p.build(P.seed + s, l);
        const b = bounds(o);
        o.position.set((s - 1) * step, b.min.y < -0.3 ? -b.min.y : 0, -l * step);
        scene.add(o);
        objs.push(o);
        if (s === 1) label(`LOD ${l}`, `${o.userData.triangles} tris`, new THREE.Vector3(0, -0.2, -l * step + step * 0.42));
      }
    label(p.name, `seeds ${P.seed}–${P.seed + 2}`, new THREE.Vector3(0, probe.y * 1.05, -2 * step));
    center.set(0, probe.y * 0.4, -step);
    maxW = step * 3;
    groundPlane(maxW * 2, REGIONS[p.region].ground);
  } else {
    // every plant in a row by region, three seeds each, biggest first
    for (const k of regionKeys) {
      const plants = REGIONS[k].plants.slice().sort((a, b) => bounds(b.build(1, 2)).getSize(new THREE.Vector3()).y - bounds(a.build(1, 2)).getSize(new THREE.Vector3()).y);
      let x = 0, rowDepth = 0;
      for (const p of plants) {
        const probe = bounds(p.build(P.seed, 0)).getSize(new THREE.Vector3());
        const step = Math.max(probe.x, probe.z) * 1.05 + 1;
        const t = tris(p);
        for (let s = 0; s < 3; s++) {
          const o = build(p, P.seed + s);
          const b = bounds(o.isLOD ? o.levels[0].object : o);
          o.position.set(x + step / 2, b.min.y < -0.3 ? -b.min.y : 0, z);
          scene.add(o);
          objs.push(o);
          if (s === 1) label(p.name, `${t.join(' / ')} tris`, new THREE.Vector3(x + step / 2, -0.4, z + step * 0.6));
          x += step;
        }
        x += 2;
        rowDepth = Math.max(rowDepth, step);
        state.stats[p.id] = { triangles: t, size: probe.toArray().map((v) => +v.toFixed(1)) };
      }
      label(REGIONS[k].name, '', new THREE.Vector3(-4, 0, z));
      maxW = Math.max(maxW, x);
      z += rowDepth + 8;
    }
    center.set(maxW / 2, 6, z / 2 - 4);
    const plane = groundPlane(Math.max(maxW, z) * 1.5, single ? single.ground : 0x5a5e55);
    plane.position.set(maxW / 2, 0, z / 2);
  }
  scene.updateMatrixWorld(true);
  const box = new THREE.Box3();
  for (const o of objs) box.expandByObject(o.isLOD ? o.levels[0].object : o);
  const ext = box.getSize(new THREE.Vector3()), size = ext.length();
  box.getCenter(center);
  const tanV = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const fit = Math.max(ext.y / (2 * tanV), Math.max(ext.x, ext.z) / (2 * tanV * camera.aspect)) * 1.12 + Math.min(ext.x, ext.z) / 2;
  const dist = P.dist ?? fit;
  if (P.ty !== null) center.y = P.ty;
  if (P.tx !== null) center.x = P.tx;
  const pitch = THREE.MathUtils.degToRad(P.pitch ?? 10), yaw = THREE.MathUtils.degToRad(P.yaw);
  camera.position.copy(center).add(new THREE.Vector3(Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), Math.cos(yaw) * Math.cos(pitch)).multiplyScalar(dist));
  controls.target.copy(center);
  fitShadow(center, size * 0.7);
  controls.autoRotate = P.turntable;
  controls.autoRotateSpeed = 0.6;
}

// ---------------------------------------------------------------- the forest view

function noise2(seed) {
  const r = rng(seed), N = 256, perm = new Uint8Array(N * 2), val = new Float32Array(N);
  for (let i = 0; i < N; i++) { perm[i] = i; val[i] = r(); }
  for (let i = N - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]]; }
  for (let i = 0; i < N; i++) perm[N + i] = perm[i];
  const at = (x, y) => val[perm[(x & 255) + perm[y & 255]]];
  return (x, y) => {
    const ix = Math.floor(x), iy = Math.floor(y);
    let fx = x - ix, fy = y - iy;
    fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
    const a = at(ix, iy), b = at(ix + 1, iy), c = at(ix, iy + 1), d = at(ix + 1, iy + 1);
    return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
  };
}
const n1 = noise2(11), n2 = noise2(23);
const fbm = (x, y) => n1(x, y) * 0.55 + n1(x * 2.1, y * 2.1) * 0.28 + n2(x * 4.3, y * 4.3) * 0.17;
const sstep = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const PILLARS = Array.from({ length: 14 }, (_, i) => {
  const r = rng(500 + i), a = i * 2.4, d = i === 0 ? 0 : 40 + r() * 170;
  return { x: Math.cos(a) * d, z: Math.sin(a) * d, r: 9 + r() * 14, h: 45 + r() * 70 };
});
const TERRAIN = {
  iceCrown: (x, z) => 1.5 + 9 * fbm(x / 70, z / 70) + 5 * sstep(-50, 150, z) - 4 * sstep(-80, -200, z),
  fjords: (x, z) => -6 + Math.max(0, z + 120) * 0.42 + 26 * fbm(x / 60, z / 60) + 14 * sstep(0.55, 0.7, fbm(x / 25, z / 25)),
  mistwood: (x, z) => -1.2 + 4.2 * sstep(0.4, 0.56, fbm(x / 55, z / 55)) + 0.8 * fbm(x / 8, z / 8),
  spires: (x, z) => {
    let h = -3 + 2 * fbm(x / 30, z / 30);
    for (const p of PILLARS) {
      const d = Math.hypot(x - p.x, z - p.z) / p.r;
      h = Math.max(h, p.h * sstep(1.12, 0.95, d) + 4 * fbm(x / 9, z / 9) * sstep(1.0, 0.9, d) - 6 * d * d * sstep(1.0, 0.9, d));
    }
    return h;
  },
};
const ROCK = { iceCrown: [0xe6eef6, 0xb9c9d8], fjords: [0x6a6e64, 0x8a8a84], mistwood: [0x2f3d24, 0x46402f], spires: [0xd2ccbc, 0xb7ad98] };

function forest() {
  const k = regionKeys[0], reg = REGIONS[k], height = TERRAIN[k];
  const half = 520, res = k === 'spires' ? 2.5 : 4, n = Math.round((half * 2) / res);
  const g = new THREE.PlaneGeometry(half * 2, half * 2, n, n);
  g.rotateX(-Math.PI / 2);
  const pos = g.getAttribute('position'), col = new Float32Array(pos.count * 3);
  const [ca, cb] = ROCK[k].map((c) => new THREE.Color(c));
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i), y = height(x, z);
    pos.setY(i, y);
    const slope = Math.abs(height(x + 1, z) - y) + Math.abs(height(x, z + 1) - y);
    const c = ca.clone().lerp(cb, Math.min(1, slope * 0.8));
    col.set([c.r, c.g, c.b], i * 3);
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.computeVertexNormals();
  const land = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95 }));
  land.receiveShadow = true;
  scene.add(land);
  const water = new THREE.Mesh(new THREE.CircleGeometry(3000, 64).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: reg.water, roughness: 0.12, metalness: 0.1 }));
  scene.add(water);

  // the focus: the land point nearest the middle where the region's first plant grows
  const hero = reg.plants[0];
  let focus = new THREE.Vector3();
  for (let rr = 0; rr < 300; rr += 4) {
    let found = false;
    for (let a = 0; a < 6.28 && !found; a += 0.3) {
      const x = Math.cos(a) * rr, z = Math.sin(a) * rr, y = height(x, z);
      if (y > hero.placement.minHeight + 0.5 && y < hero.placement.maxHeight) { focus.set(x, y, z); found = true; }
    }
    if (found) break;
  }
  const slopeAt = (x, z) => {
    const dx = (height(x + 0.7, z) - height(x - 0.7, z)) / 1.4, dz = (height(x, z + 0.7) - height(x, z - 0.7)) / 1.4;
    return { deg: THREE.MathUtils.radToDeg(Math.atan(Math.hypot(dx, dz))), down: new THREE.Vector3(-dx, 0, -dz).normalize() };
  };
  const fields = [];
  let copies = 0;
  for (const p of reg.plants) {
    const { minHeight, maxHeight, maxSlope, density, cluster } = p.placement;
    const cell = Math.sqrt(100 / density), R = Math.min(half - 10, p.lodDistances[2] * 1.05 + 30);
    const r = rng(p.id.length * 131 + 7), clump = noise2(p.id.length * 17 + 3);
    const mats = [];
    for (let x = -R; x < R; x += cell)
      for (let z = -R; z < R; z += cell) {
        const px = focus.x + x + r() * cell, pz = focus.z + z + r() * cell;
        if (Math.hypot(px - focus.x, pz - focus.z) > R) continue;
        const y = height(px, pz);
        if (y < minHeight || y > maxHeight) continue;
        const s = slopeAt(px, pz);
        if (s.deg > maxSlope) continue;
        const m = clump(px / 14, pz / 14);
        if (r() > 1 - cluster + cluster * sstep(0.45, 0.62, m) * 1.6) continue;
        const yaw = /cleft|crown-pine/.test(p.id) && s.deg > 8 ? Math.atan2(s.down.x, s.down.z) - (/crown-pine/.test(p.id) ? Math.PI / 2 : 0) : r() * Math.PI * 2;
        const sc = 0.85 + r() * 0.3;
        mats.push(new THREE.Matrix4().compose(new THREE.Vector3(px, y, pz), new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), yaw), new THREE.Vector3(sc, sc, sc)));
      }
    if (!mats.length) continue;
    const f = plantField(p, mats, 4, P.seed);
    scene.add(f.group);
    fields.push({ p, f, n: mats.length });
    copies += mats.length;
  }
  const dist = P.dist ?? 60, yaw = THREE.MathUtils.degToRad(P.yaw);
  const target = focus.clone().add(new THREE.Vector3(0, dist > 150 ? 18 : dist > 30 ? 6 : 1.2, 0));
  const eye = target.clone().add(new THREE.Vector3(Math.sin(yaw) * dist, 0, Math.cos(yaw) * dist));
  eye.y = Math.max(height(eye.x, eye.z), 0) + (P.h ?? (dist > 30 ? 8 : 2.2));
  if (P.pitch !== null) eye.y = target.y + Math.tan(THREE.MathUtils.degToRad(P.pitch)) * dist;
  camera.position.copy(eye);
  controls.target.copy(target);
  fitShadow(target, Math.min(160, dist * 1.2 + 30));
  controls.autoRotate = P.turntable;
  controls.autoRotateSpeed = 0.3;
  state.stats.fields = fields.map(({ p, n }) => `${p.id}: ${n}`);
  state.stats.copies = copies;
  state.fields = fields;
}

if (P.view === 'forest') forest(); else grid();

// ---------------------------------------------------------------- the loop

const wdir = new THREE.Vector3(1, 0, 0.35).normalize();
const t0 = performance.now();
const statsEl = document.getElementById('stats');
THREE.DefaultLoadingManager.onLoad = () => { state.loaded = true; };
function frame() {
  const t = (performance.now() - t0) / 1000;
  setWind(t, wdir, P.wind);
  controls.update();
  for (const f of state.fields ?? []) f.f.update(camera.position);
  renderer.render(scene, camera);
  for (const l of labels) {
    const v = l.pos.clone().project(camera);
    l.el.style.display = v.z < 1 && Math.abs(v.x) < 1.1 && Math.abs(v.y) < 1.1 ? '' : 'none';
    l.el.style.left = `${(v.x * 0.5 + 0.5) * innerWidth}px`;
    l.el.style.top = `${(-v.y * 0.5 + 0.5) * innerHeight}px`;
  }
  state.frames++;
  if (state.frames % 30 === 1) {
    const i = renderer.info.render;
    const fieldTris = (state.fields ?? []).reduce((s, f) => s + f.f.triangles(), 0);
    statsEl.textContent = `${P.view} · ${P.region} · lod ${P.lod} · ${P.light} · wind ${P.wind}\n` +
      `draw calls ${i.calls} · triangles ${i.triangles}` + (state.fields ? `\nplant copies ${state.stats.copies} · plant triangles ${fieldTris}\n${state.stats.fields.join('\n')}` : '');
  }
  if (state.loaded && state.frames > 20) state.ready = true;
  requestAnimationFrame(frame);
}
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
});
// nothing to load (no textures yet) still counts as loaded
setTimeout(() => { state.loaded = true; }, 4000);
frame();
</script>
</body>
</html>
